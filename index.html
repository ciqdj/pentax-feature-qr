<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="K-1 II 四个功能二维码，在浏览器本地生成。">
  <title>K-1 II 功能二维码</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <main>
    <header class="intro">
      <div class="eyebrow"><span class="camera-mark" aria-hidden="true"></span>K-1 II ONLY</div>
      <h1>功能二维码</h1>
      <p>一个序列号，四个功能。</p>
    </header>
    <section class="input-panel" aria-label="生成二维码">
      <form id="generator" novalidate aria-busy="false">
        <label for="serial">相机序列号</label>
        <div class="input-row">
          <input id="serial" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="输入机身序列号" aria-describedby="status privacy">
          <button id="generate" type="submit">生成二维码<span aria-hidden="true"> ↗</span></button>
        </div>
        <progress id="progress" max="4" value="0" aria-label="生成进度" hidden></progress>
        <div class="input-notes">
          <p id="privacy">本地计算 · 序列号不上传</p>
          <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </form>
    </section>
    <section id="results" aria-label="生成结果" hidden>
      <div class="results-header">
        <h2>序列号 <span id="result-serial"></span></h2>
        <a id="download-all" class="download-all">下载全部 <span class="zip-label">ZIP</span></a>
      </div>
      <div id="cards" class="cards"></div>
    </section>
    <noscript>请启用 JavaScript 后使用。</noscript>
    <footer>仅适用于 PENTAX K-1 II <span aria-hidden="true">·</span> 非官方工具</footer>
  </main>
</body>
</html>
